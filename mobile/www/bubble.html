<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <style>
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      background: transparent;
      overflow: hidden;
    }

    :root {
      /* Paleta por defecto (morado/lavanda). Cambia solo estas variables
         desde JS para recolorear la burbuja sin tocar el resto del CSS. */
      --color-1: #2c1a4d;
      --color-2: #6b46c1;
      --color-3: #b794f6;
      --color-4: #8f8fd9;
      --color-5: #3b1f63;
      --color-acento: #5a8fd9;
      --velocidad-giro: 6s;
      --velocidad-pulso: 2.8s;
      --escala-audio: 1;
    }

    /* --- Estilo Siri: orbe oscuro con manchas de color difuminadas que
       se mueven y se funden (filter: blur sobre capas separadas).
       Nada de conic-gradients duros ni SVG: eso era lo que se veía
       cuadrado y con artefactos. */
    .burbuja {
      width: 76px;
      height: 76px;
      border-radius: 50%;
      position: relative;
      cursor: pointer;
      -webkit-app-region: drag;
      overflow: hidden;
      background: radial-gradient(circle at 50% 45%, #191228 0%, #0c0917 70%);
      box-shadow:
        0 0 22px rgba(107, 70, 193, 0.45),
        inset 0 0 0 1px rgba(255, 255, 255, 0.10);
      animation: respirar-burbuja var(--velocidad-pulso) ease-in-out infinite;
      transition: box-shadow .4s ease;
      isolation: isolate;
      transform-origin: center;
    }

    /* Manchas de color: cada una es un radial-gradient grande y difuso,
       animado con translate/scale para que se "mezclen" como el orbe Siri. */
    .burbuja .mancha {
      position: absolute;
      width: 110%;
      height: 110%;
      border-radius: 50%;
      filter: blur(18px);
      will-change: transform;
    }

    .mancha-1 {
      background: radial-gradient(circle, var(--color-2) 0%, transparent 70%);
      top: -12%; left: -12%;
      animation: mover-1 var(--velocidad-giro) ease-in-out infinite alternate;
    }

    .mancha-2 {
      background: radial-gradient(circle, var(--color-3) 0%, transparent 70%);
      bottom: -18%; right: -12%;
      animation: mover-2 var(--velocidad-giro) ease-in-out infinite alternate;
    }

    .mancha-3 {
      background: radial-gradient(circle, var(--color-4) 0%, transparent 70%);
      top: 22%; left: 26%;
      opacity: .8;
      animation: mover-3 var(--velocidad-giro) ease-in-out infinite alternate;
    }

    /* Acento azulado: da el contraste frío que tiene el orbe de Siri frente
       a los morados. */
    .mancha-4 {
      background: radial-gradient(circle, var(--color-acento) 0%, transparent 70%);
      bottom: -10%; left: -18%;
      opacity: .65;
      animation: mover-2 calc(var(--velocidad-giro) * 1.3) ease-in-out infinite alternate;
    }

    /* El blur de las manchas puede dejar una franja recta en el borde del
       overflow circle (artefacto que se veia "cuadrada"). Esta capa aplica
       una mascara radial al contenedor: difumina el recorte y desaparece
       cualquier borde duro. */
    .burbuja::before {
      content: '';
      position: absolute;
      inset: 0;
      border-radius: 50%;
      z-index: 2;
      background: transparent;
      -webkit-mask-image: none;
      box-shadow: inset 0 0 14px 8px #0c0917;
      pointer-events: none;
    }

    /* Brillo especular sutil arriba-izquierda, como vidrio. */
    .burbuja::after {
      content: '';
      position: absolute;
      inset: 0;
      border-radius: 50%;
      background: radial-gradient(circle at 32% 26%, rgba(255,255,255,.28) 0%, rgba(255,255,255,0) 42%);
      z-index: 3;
      pointer-events: none;
    }

    /* Estados: escuchando -> colores más vivos y rápidos.
       Hablando -> pulso amplio y resplandor morado fuerte. */
    .burbuja.escuchando {
      --velocidad-giro: 2.4s;
      --velocidad-pulso: 1.2s;
      box-shadow:
        0 0 30px rgba(107, 70, 193, 0.85),
        inset 0 0 0 1px rgba(255, 255, 255, 0.18);
    }

    .burbuja.hablando {
      --velocidad-giro: 1.8s;
      box-shadow:
        0 0 36px rgba(183, 148, 246, 0.9),
        inset 0 0 0 1px rgba(255, 255, 255, 0.22);
    }

    @keyframes mover-1 {
      from { transform: translate(0, 0) scale(1); }
      to   { transform: translate(34%, 30%) scale(1.25); }
    }

    @keyframes mover-2 {
      from { transform: translate(0, 0) scale(1.1); }
      to   { transform: translate(-30%, -26%) scale(.85); }
    }

    @keyframes mover-3 {
      from { transform: translate(0, 0) scale(.9); }
      to   { transform: translate(-22%, 24%) scale(1.2); }
    }

    @keyframes respirar-burbuja {
      0%, 100% { transform: scale(var(--escala-audio)); }
      50% { transform: scale(calc(var(--escala-audio) * 1.06)); }
    }

    /* Cuando está inactiva la burbuja late más lento y tenue, para no
       distraer. La clase .idle la pone el renderer. */
    .burbuja.idle {
      --velocidad-giro: 10s;
      --velocidad-pulso: 5s;
      opacity: 0.75;
    }
  </style>
</head>
<body>
  <div class="burbuja" id="burbuja">
    <div class="mancha mancha-1"></div>
    <div class="mancha mancha-2"></div>
    <div class="mancha mancha-3"></div>
    <div class="mancha mancha-4"></div>
  </div>

  <script src="bubble-renderer.js"></script>
</body>
</html>
